<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>تسجيل دخول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Tajawal&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"> <!-- للرموز -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #007bff;
      text-align: center;
      font-size: 26px;
    }

    .input-field {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }

    .input-field:focus {
      border-color: #007bff;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background-color: #007bff;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 15px 0;
    }

    .login-btn:hover {
      background-color: #0056b3;
    }

    .social-btns {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      width: 48%;
      font-size: 16px;
    }

    .google-btn {
      background-color: #db4437;
      color: white;
    }

    .facebook-btn {
      background-color: #4267b2;
      color: white;
    }

    .social-btn i {
      margin-left: 10px;
    }

    .register-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #007bff;
      font-size: 16px;
      text-decoration: none;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h2>تسجيل الدخول</h2>
    <form action="#" method="POST">
      <input type="email" class="input-field" placeholder="البريد الإلكتروني" required>
      <input type="password" class="input-field" placeholder="كلمة المرور" required>
      <button type="submit" class="login-btn">تسجيل الدخول</button>
    </form>

    <div class="social-btns">
      <!-- Google Login Button -->
      <button class="social-btn google-btn" id="google-signin-btn">
        <i class="fab fa-google"></i> تسجيل الدخول عبر جوجل
      </button>
      <!-- Facebook Login Button -->
      <button class="social-btn facebook-btn" id="facebook-signin-btn">
        <i class="fab fa-facebook-f"></i> تسجيل الدخول عبر فيسبوك
      </button>
    </div>

    <a href="#" class="register-link">ليس لديك حساب؟ تسجيل جديد</a>
  </div>

  <!-- Google Sign-In SDK -->
  <script src="https://apis.google.com/js/platform.js" async defer></script>

  <!-- Facebook SDK -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v12.0&appId=YOUR_FACEBOOK_APP_ID&autoLogAppEvents=1"></script>

  <script>
    // Google Sign-In Configuration
    function onSignIn(googleUser) {
      var profile = googleUser.getBasicProfile();
      alert("مرحباً، " + profile.getName());
      // يمكنك الآن إرسال الـ profile data إلى الخادم للتحقق من التسجيل.
    }

    // إعدادات Google Sign-In مع Client ID
    gapi.load('auth2', function() {
      gapi.auth2.init({
        client_id: '110181416411-askejf40h80327n8qdi4mr4nuap8jbta.apps.googleusercontent.com' // ضع هنا الـ Client ID الخاص بك
      });
    });

    // Facebook Sign-In Configuration
    window.fbAsyncInit = function() {
      FB.init({
        appId: 'YOUR_FACEBOOK_APP_ID', // استبدلها بالـ App ID الخاص بك
        cookie: true,
        xfbml: true,
        version: 'v12.0'
      });

      // تسجيل الدخول عبر فيسبوك
      document.getElementById('facebook-signin-btn').onclick = function() {
        FB.login(function(response) {
          if (response.authResponse) {
            alert("تم تسجيل الدخول عبر فيسبوك");
          } else {
            alert("فشل تسجيل الدخول عبر فيسبوك");
          }
        });
      }
    };

    // تحميل الـ SDK الخاص بـ Facebook
    (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s); js.id = id;
      js.src = "https://connect.facebook.net/en_US/sdk.js";
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));
  </script>

</body>
</html>
