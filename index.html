<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>تسجيل دخول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Tajawal&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .login-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #007bff;
      text-align: center;
      font-size: 26px;
    }

    .input-field {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }

    .input-field:focus {
      border-color: #007bff;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background-color: #007bff;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 15px 0;
    }

    .login-btn:hover {
      background-color: #0056b3;
    }

    .social-btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .register-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #007bff;
      font-size: 16px;
      text-decoration: none;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h2>تسجيل الدخول</h2>
    <form action="#" method="POST">
      <input type="email" class="input-field" placeholder="البريد الإلكتروني" required>
      <input type="password" class="input-field" placeholder="كلمة المرور" required>
      <button type="submit" class="login-btn">تسجيل الدخول</button>
    </form>

    <div class="social-btns">
      <!-- Google Sign-In الرسمي -->
      <div id="g_id_onload"
        data-client_id="110181416411-cn9daabc4h5r0v824g29bvo13kvt7edf.apps.googleusercontent.com"
        data-context="signin"
        data-ux_mode="popup"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false">
      </div>

      <div class="g_id_signin"
        data-type="standard"
        data-shape="rectangular"
        data-theme="filled_blue"
        data-text="signin_with"
        data-size="large"
        data-logo_alignment="left">
      </div>
    </div>

    <a href="#" class="register-link">ليس لديك حساب؟ تسجيل جديد</a>
  </div>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    function handleCredentialResponse(response) {
      console.log("JWT Token:", response.credential);
      alert("تم تسجيل الدخول عبر Google!");
      // هنا تقدر ترسل التوكين للسيرفر باستخدام fetch أو XMLHttpRequest
    }
  </script>

</body>
</html>
