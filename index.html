<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>تسجيل دخول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Tajawal&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    .login-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-container h2 {
      margin-bottom: 20px;
      color: #007bff;
      text-align: center;
      font-size: 26px;
    }
    .input-field {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
    }
    .input-field:focus { border-color: #007bff; }
    .login-btn {
      width: 100%;
      padding: 15px;
      background-color: #007bff;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 15px 0;
    }
    .login-btn:hover { background-color: #0056b3; }
    .social-btns {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      background-color: #db4437;
      color: white;
    }
    .social-btn i { margin-left: 10px; }
    .register-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #007bff;
      font-size: 16px;
      text-decoration: none;
    }
    .register-link:hover { text-decoration: underline; }
  </style>
</head>

<body>

  <div class="login-container">
    <h2>تسجيل الدخول</h2>
    <form action="#" method="POST">
      <input type="email" class="input-field" placeholder="البريد الإلكتروني" required>
      <input type="password" class="input-field" placeholder="كلمة المرور" required>
      <button type="submit" class="login-btn">تسجيل الدخول</button>
    </form>

    <div class="social-btns">
      <!-- Google Login Button -->
      <div id="googleSignInBtn" class="social-btn google-btn">
        <i class="fab fa-google"></i> تسجيل الدخول عبر جوجل
      </div>
    </div>

    <a href="#" class="register-link">ليس لديك حساب؟ تسجيل جديد</a>
  </div>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "https://110181416411-cn9daabc4h5r0v824g29bvo13kvt7edf.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      document.getElementById("googleSignInBtn").onclick = function () {
        google.accounts.id.prompt(); // تفتح نافذة تسجيل الدخول
      };
    };

    function handleCredentialResponse(response) {
      // استخراج بيانات المستخدم من JWT
      const jwt = response.credential;
      const payload = JSON.parse(atob(jwt.split('.')[1]));
      alert("مرحباً، " + payload.name + "\nبريدك: " + payload.email);
    }
  </script>

</body>
</html>
